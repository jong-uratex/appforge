# Cloudflare Pages & Workers Configuration for Uratex MIS AppForge
name = "uratex-mis-appforge"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./dist"

# Cloudflare D1 Relational SQLite Database Binding
# 1. Create database in Cloudflare Dashboard -> Storage & databases -> D1 SQLite Database
#    or run: npx wrangler d1 create uratex-appforge-db
# 2. Paste the generated database_id below and run:
#    npx wrangler d1 migrations apply uratex-appforge-db --remote
[[d1_databases]]
binding = "DB"
database_name = "uratex-appforge-db"
database_id = "your-d1-database-id-here"
migrations_dir = "migrations"

# Optional Cloudflare KV for edge read caching
[[kv_namespaces]]
binding = "APPFORGE_KV"
id = "your-kv-namespace-id-here"

[vars]
ENVIRONMENT = "production"
ORGANIZATION = "Uratex Philippines"

pages_build_output_dir = "dist"
