# Cloudflare Pages & Workers Configuration for Uratex MIS AppForge
name = "uratex-mis-appforge"
compatibility_date = "2026-11-09"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare D1 Relational SQLite Database Binding
# Bind in Cloudflare Pages -> Settings -> Functions -> D1 database bindings (Variable name: DB)
[[d1_databases]]
binding = "DB"
database_name = "uratex-appforge-db"
database_id = "3028f72f-adb0-4ff5-9e82-820ee707c97c"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
ORGANIZATION = "Uratex Philippines"

